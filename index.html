<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collab Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --indigo: #123257;        /* BizBox primary blue */
    --indigo-deep: #0D2440;   /* a touch darker for any hover/accents */
    --page:   #F4F5F9;
    --ink:    #2A2F45;
    --ink-2:  #5A6079;
    --muted:  #A6ACC2;
    --sidebar-w: 230px;
    --sidebar-w-collapsed: 76px;
    --ease: cubic-bezier(0.4, 0.0, 0.2, 1);
    /* Color the active sidebar item bleeds out to. Set per-module via
       data-active-bg on the nav link; defaults to the page color so the
       tab looks like an extension of the content area. RFC overrides
       this to white so the active tab matches the RFC header. */
    --active-bg: var(--page);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--page);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .app {
    height: 100vh;
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    transition: grid-template-columns 0.28s var(--ease);
  }
  .app.collapsed {
    grid-template-columns: var(--sidebar-w-collapsed) 1fr;
  }

  /* ============ SIDEBAR ============ */
  .sidebar {
    background: var(--indigo);
    color: #fff;
    padding: 36px 0 28px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: visible;
  }

  /* logo row — uses margin-bottom for spacing (not padding) so height stays
     clean and the absolutely-positioned mini-P can center inside it. */
  .logo {
    position: relative;
    height: 28px;
    margin: 0 0 60px;
    padding: 0 32px;
    font-weight: 700;
    letter-spacing: 3px;
    font-size: 20px;
    display: flex;
    align-items: center;
    transition: padding 0.28s var(--ease);
  }
  .logo .full {
    transition: opacity 0.18s var(--ease);
  }
  .logo .mini {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s var(--ease);
    font-weight: 700;
    letter-spacing: 0;
    font-size: 22px;
  }
  .app.collapsed .logo { padding: 0; }
  .app.collapsed .logo .full { opacity: 0; }
  .app.collapsed .logo .mini { opacity: 1; }

  /* nav */
  .nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 0 18px;
    transition: padding 0.28s var(--ease);
  }
  .app.collapsed .nav { padding: 0 14px; }

  .nav a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    font-weight: 400;
    text-decoration: none;
    border-radius: 12px;
    transition: background .2s, padding 0.28s var(--ease), gap 0.28s var(--ease);
    cursor: pointer;
    position: relative;
    white-space: nowrap;
  }
  .nav a:hover:not(.active) { background: rgba(255,255,255,0.08); }
  .nav a svg {
    width: 20px;
    height: 20px;
    stroke: #fff;
    stroke-width: 1.8;
    fill: none;
    flex-shrink: 0;
  }
  .nav a .label {
    transition: opacity 0.15s var(--ease), max-width 0.28s var(--ease);
    overflow: hidden;
    display: inline-block;
    max-width: 200px;
  }

  /* collapsed nav styling — zero gap, padding squares the item so the icon
     ends up perfectly centered without floating off-axis. */
  .app.collapsed .nav a {
    padding: 12px;
    gap: 0;
    justify-content: center;
  }
  .app.collapsed .nav a .label {
    opacity: 0;
    max-width: 0;
    pointer-events: none;
  }

  /* tooltip for collapsed nav items — :not(.active) keeps the active item's
     ::before free for the notch effect. */
  .app.collapsed .nav a:not(.active)::before {
    content: attr(data-label);
    position: absolute;
    left: calc(100% + 14px);
    top: 50%;
    transform: translateY(-50%) translateX(-6px);
    background: var(--ink);
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
    z-index: 100;
    box-shadow: 0 6px 16px -4px rgba(40,45,75,0.4);
  }
  .app.collapsed .nav a:not(.active):hover::before {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }

  /* active state — notch effect. Uses --active-bg so each module can
     set its own "extending color" to match whatever is rendered just
     past the sidebar's edge (e.g. white for RFC's header strip). */
  .nav a.active {
    background: var(--active-bg);
    color: var(--ink);
    font-weight: 500;
    margin-right: -18px;
    border-radius: 22px 0 0 22px;
    transition: background .2s, color .2s;
  }
  .nav a.active svg { stroke: var(--indigo); }
  .nav a.active::before,
  .nav a.active::after {
    content: '';
    position: absolute;
    right: 0;
    width: 22px;
    height: 22px;
    pointer-events: none;
  }
  .nav a.active::before {
    top: -22px;
    background: radial-gradient(circle at 0 0, transparent 22px, var(--active-bg) 22px);
  }
  .nav a.active::after {
    bottom: -22px;
    background: radial-gradient(circle at 0 100%, transparent 22px, var(--active-bg) 22px);
  }
  /* In collapsed mode the nav padding shrinks, so the active item only needs
     to extend negatively by that smaller amount to reach the sidebar edge. */
  .app.collapsed .nav a.active { margin-right: -14px; }

  /* sign-out */
  .sign-out {
    margin-top: auto;
    padding: 0 18px;
    transition: padding 0.28s var(--ease);
  }
  .app.collapsed .sign-out { padding: 0 14px; }
  .sign-out a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
    border-radius: 12px;
    transition: background .2s, padding 0.28s var(--ease), gap 0.28s var(--ease);
    white-space: nowrap;
    position: relative;
  }
  .sign-out a:hover { background: rgba(255,255,255,0.08); }
  .sign-out svg {
    width: 20px;
    height: 20px;
    stroke: #fff;
    stroke-width: 1.8;
    fill: none;
    flex-shrink: 0;
  }
  .sign-out a .label {
    transition: opacity 0.15s var(--ease), max-width 0.28s var(--ease);
    overflow: hidden;
    display: inline-block;
    max-width: 200px;
  }
  .app.collapsed .sign-out a {
    padding: 12px;
    gap: 0;
    justify-content: center;
  }
  .app.collapsed .sign-out a .label {
    opacity: 0;
    max-width: 0;
    pointer-events: none;
  }
  .app.collapsed .sign-out a::before {
    content: attr(data-label);
    position: absolute;
    left: calc(100% + 14px);
    top: 50%;
    transform: translateY(-50%) translateX(-6px);
    background: var(--ink);
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
    z-index: 100;
    box-shadow: 0 6px 16px -4px rgba(40,45,75,0.4);
  }
  .app.collapsed .sign-out a:hover::before {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }

  /* ============ FRAME HOST ============ */
  .frame-host {
    position: relative;
    overflow: hidden;
    background: var(--page);
  }
  /* Each module gets its own persistent iframe — they stack at the same
     position via absolute positioning, only the active one is visible.
     Inactive iframes stay alive in the DOM, preserving their authenticated
     sessions (SharePoint sign-in for RFC, Apps Script for Calendar, etc.)
     so switching modules doesn't trigger a re-load or re-auth. */
  iframe.module {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--page);
    display: none;
  }
  iframe.module.active {
    display: block;
  }

  /* loading overlay */
  .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--page);
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
    z-index: 5;
  }
  .loading.on { opacity: 1; }
  .spinner {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid #E2E5F0;
    border-top-color: var(--indigo);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

</style>
</head>
<body>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <span class="full">PROJEX</span>
      <span class="mini">P</span>
    </div>

    <nav class="nav" id="nav">
      <a data-module="home" data-label="Home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2V11z"/></svg>
        <span class="label">Home</span>
      </a>
      <a data-module="rfc" data-label="RFC" data-active-bg="#ffffff">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6M9 9h2"/></svg>
        <span class="label">RFC</span>
      </a>
      <a data-module="calendar" data-label="Calendar" class="active">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
        <span class="label">Calendar</span>
      </a>
      <a data-module="ui-guidelines" data-label="UI Guidelines">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18M3 12h18"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="label">UI Guidelines</span>
      </a>
      <a data-module="food-tracker" data-label="Food Tracker">
        <svg viewBox="0 0 24 24"><path d="M12 7.5c-2-3.5-7-2.5-7 3 0 4 3 11 7 11s7-7 7-11c0-5.5-5-6.5-7-3z"/><path d="M12 7.5C12 5 13.5 3 16 3"/></svg>
        <span class="label">Food Tracker</span>
      </a>
      <a data-module="brand-asset" data-label="Brand Asset">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.6 0 1-.4 1-1 0-.3-.1-.5-.3-.7-.2-.2-.3-.4-.3-.6 0-.6.4-1 1-1H15c3.3 0 6-2.7 6-6 0-5-4-9-9-9z"/><circle cx="6.5" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="8.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="13.5" cy="6.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="17.5" cy="10.5" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span class="label">Brand Asset</span>
      </a>
    </nav>

    <div class="sign-out">
      <a data-label="Sign out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span class="label">Sign out</span>
      </a>
    </div>
  </aside>

  <main class="frame-host" id="frameHost">
    <div class="loading on" id="loading"><div class="spinner"></div></div>
    <!-- iframes are inserted dynamically by the script below — one per module,
         kept alive after creation so signed-in state and loaded data persist. -->
  </main>

</div>

<script>
  /* ---------- Module manifest ---------- */
  const MODULES = {
    'home':           'modules/home.html',
    'rfc':            'modules/rfc.html',
    'calendar':       'modules/room-scheduler.html',
    'ui-guidelines':  'modules/ui-guidelines.html',
    'food-tracker':   'modules/food-tracker.html',
    'brand-asset':    'modules/brand-asset.html',
  };

  const app       = document.getElementById('app');
  const sidebar   = document.getElementById('sidebar');
  const frameHost = document.getElementById('frameHost');
  const loading   = document.getElementById('loading');
  const links     = document.querySelectorAll('[data-module]');

  function setActive(linkEl) {
    links.forEach(a => a.classList.remove('active'));
    linkEl.classList.add('active');
    // Each nav item can declare its own "extends-to-content" color via
    // data-active-bg. RFC uses white so the active tab seamlessly meets
    // the RFC header. Default is the page color (#F4F5F9).
    const bg = linkEl.dataset.activeBg || 'var(--page)';
    document.documentElement.style.setProperty('--active-bg', bg);
  }

  /* ─────────────────────────────────────────────────────────────────
     Keep-alive iframe router
     ─────────────────────────────────────────────────────────────────
     Each module gets its own iframe, created on first open. After that
     the iframe stays in the DOM forever — switching modules just toggles
     which iframe is .active (display: block). This preserves:
       - Sign-in state (RFC's SharePoint session — no re-auth on every
         switch back from Calendar)
       - Loaded data (Calendar's bookings stay in memory, no re-fetch)
       - Local UI state (UI Guidelines' Configure modal position, etc.)

     `iframes` maps each module key to its iframe element. `activeKey`
     tracks which one is currently visible.
     ───────────────────────────────────────────────────────────────── */
  const iframes  = {};
  let activeKey  = null;

  function loadModule(key, linkEl) {
    const url = MODULES[key];
    if (!url) return;

    // Clicking the same module that's already active — no-op. Avoids
    // re-rendering an iframe that's already showing what the user wants.
    if (key === activeKey) {
      setActive(linkEl);
      return;
    }

    // Hide the currently visible iframe (it stays in the DOM, just out
    // of sight — preserves all its state).
    if (activeKey && iframes[activeKey]) {
      iframes[activeKey].classList.remove('active');
    }

    // Get-or-create the iframe for this module.
    let frame = iframes[key];
    if (!frame) {
      // First time opening this module — create and start loading.
      frame = document.createElement('iframe');
      frame.className = 'module';
      frame.title = key;
      frame.setAttribute('data-module-key', key);
      // 'allow' grants common capabilities the embedded modules need
      // (clipboard for copy/paste, autoplay for any media, etc.). Doesn't
      // affect security boundaries — iframe is still same-origin sandboxed.
      frame.setAttribute('allow', 'clipboard-read; clipboard-write; autoplay');
      frame.addEventListener('load', () => {
        if (key === activeKey) loading.classList.remove('on');
      });
      frameHost.appendChild(frame);
      iframes[key] = frame;
      loading.classList.add('on');
      frame.src = url;
    } else {
      // Already loaded — instant switch, no spinner.
      loading.classList.remove('on');
    }

    frame.classList.add('active');
    activeKey = key;
    setActive(linkEl);
    try { localStorage.setItem('projex.lastModule', key); } catch (_) {}
  }

  links.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      loadModule(link.dataset.module, link);
    });
  });

  /* ─────────────────────────────────────────────────────────────────
     Sidebar collapse behavior
     ─────────────────────────────────────────────────────────────────
     - Page open / refresh  → expanded
     - Click inside iframe  → collapse (sets user intent to collapsed)
     - Hover collapsed side → temporary visual expand (peek)
     - Mouse leaves sidebar → re-collapse if intent is collapsed

     `intentCollapsed` holds the user's logical state. `applyVisual` only
     toggles the CSS class. Hover changes the visual without touching
     intent, so leaving the sidebar restores whatever the intent was.
     ───────────────────────────────────────────────────────────────── */
  let intentCollapsed = false;

  function applyVisual(collapsed) {
    app.classList.toggle('collapsed', collapsed);
  }
  function setIntent(collapsed) {
    intentCollapsed = collapsed;
    applyVisual(collapsed);
  }

  /* Hover-to-peek */
  sidebar.addEventListener('mouseenter', () => {
    if (intentCollapsed) applyVisual(false);
  });
  sidebar.addEventListener('mouseleave', () => {
    if (intentCollapsed) applyVisual(true);
  });

  /* Detect interaction with the iframe.

     When a user clicks inside the iframe, the parent window loses focus
     and the iframe element becomes document.activeElement. We use that
     signal — guarded with setTimeout(0) so the activeElement has had a
     chance to update — to collapse the sidebar. This is the standard
     cross-browser technique for spotting iframe activation. */
  window.addEventListener('blur', () => {
    setTimeout(() => {
      if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
        if (!intentCollapsed) setIntent(true);
      }
    }, 0);
  });

  /* Always boot expanded — explicit override of any prior session state. */
  applyVisual(false);
  try { localStorage.removeItem('projex.sidebarCollapsed'); } catch (_) {}

  /* Boot a module. Prefer the last-opened one from a prior session; fall
     back to whichever sidebar link starts with .active in markup (Calendar
     by default). We always boot SOMETHING — the iframes are dynamic now,
     so without this the content area would just show the loading spinner
     forever. */
  (function bootInitialModule() {
    let key = null, el = null;
    try {
      const last = localStorage.getItem('projex.lastModule');
      if (last && MODULES[last]) {
        const node = document.querySelector(`[data-module="${last}"]`);
        if (node) { key = last; el = node; }
      }
    } catch (_) {}
    if (!key) {
      el = document.querySelector('[data-module].active') ||
           document.querySelector('[data-module]');
      key = el && el.dataset.module;
    }
    if (key && el) loadModule(key, el);
  })();
</script>

</body>
</html>
